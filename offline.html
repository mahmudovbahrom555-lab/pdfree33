<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="robots" content="noindex">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFree — Offline</title>
  <link rel="preload" href="/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/fonts.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: var(--bg, #F7F6F2);
      color: var(--text, #1a1a1a);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo-text {
      font-weight: 800;
      font-size: 28px;
      color: var(--text, #1a1a1a);
      letter-spacing: -0.5px;
    }
    .logo-text span { color: var(--green, #2D7A4F); }
    .icon {
      font-size: 64px;
      margin: 32px 0 16px;
      line-height: 1;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--text, #1a1a1a);
    }
    p {
      font-size: 15px;
      color: var(--text2, #555);
      max-width: 360px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-group { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
    button {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--green, #2D7A4F);
      color: #fff;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text, #1a1a1a);
      border: 1.5px solid var(--border, #ddd);
    }
    .tools {
      margin-top: 48px;
      font-size: 13px;
      color: var(--text3, #999);
    }
    .tools strong {
      display: block;
      margin-bottom: 10px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .tool-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .chip {
      background: var(--surface, #fff);
      border: 1px solid var(--border, #ddd);
      border-radius: 20px;
      padding: 4px 14px;
      font-size: 13px;
      color: var(--text2, #555);
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="logo-text">PDF<span>ree</span></div>

  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>No internet connection right now. If you've used PDFree before, your tools are cached and ready to work — just go back to the app.</p>

  <div class="btn-group">
    <button class="btn-primary" onclick="location.href='/'">Open PDFree</button>
    <button class="btn-secondary" onclick="location.reload()">Try again</button>
  </div>

  <div class="tools">
    <strong>Works offline after first visit</strong>
    <div class="tool-chips">
      <a href="/merge-large-pdf-files/" class="chip">Merge PDF</a>
      <a href="/split-pdf/" class="chip">Split PDF</a>
      <a href="/compress-large-pdf-free/" class="chip">Compress PDF</a>
      <a href="/rotate-pdf/" class="chip">Rotate PDF</a>
      <a href="/jpg2pdf/" class="chip">JPG to PDF</a>
      <a href="/pdf2jpg/" class="chip">PDF to JPG</a>
    </div>
  </div>
</body>
</html>
