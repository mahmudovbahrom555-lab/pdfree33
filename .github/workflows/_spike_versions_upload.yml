name: SPIKE - versions upload validation (manual, no traffic shift)

# Throwaway, manual-only workflow — resolves two unknowns before the real
# staged-rollout mechanism (see /Users/murodjon/.claude/plans/typed-plotting-wave.md)
# gets wired into deploy.yml: does this Cloudflare account's plan actually
# support `wrangler versions upload`/`versions deploy`, and does it print a
# reachable *.workers.dev preview URL. Safe to run for real (not --dry-run):
# `versions upload` uploads code+config as an immutable Version and, per
# wrangler's own --help text, never shifts any production traffic — that's
# the entire point of the two-step upload/deploy split this whole plan
# relies on. Delete this file once its findings are recorded.

on:
  workflow_dispatch: {}

jobs:
  spike:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip3 install jinja2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: python3 scripts/build.py

      - name: Upload a real Worker version (does NOT shift traffic)
        run: |
          npx wrangler@4.86.0 versions upload --config wrangler.toml \
            --message "phase0 spike - validation only, do not promote" \
            2>&1 | tee /tmp/spike_output.txt
          echo "───────── RAW STDOUT (copy this into the plan/memory before deleting this workflow) ─────────"
          cat /tmp/spike_output.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
