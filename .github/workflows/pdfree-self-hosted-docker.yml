name: Publish pdfree self-hosted Docker image

# Publishes a self-hosted Docker image of the real pdfree.io site (the same
# dist/ scripts/build.py produces for production, plus selfhost/server.js —
# see that file's own header comment for why it imports src/index.js's real
# fetch handler directly rather than re-deriving the routing logic).
#
# Deliberately NO path filter, unlike pdf2md-server-docker.yml (which scopes
# to packages/pdf2md-server/**): this image's build context is effectively
# the whole site, same as deploy.yml (which also has no path filter) —
# scoping this narrowly would risk the image silently drifting stale from
# what's actually live, the same staleness class GUESS_REDIRECTS' own
# header comment in src/index.js warns about.
#
# Publishes to GHCR via the repo's own built-in GITHUB_TOKEN — same pattern
# as pdf2md-server-docker.yml. First-ever publish to a new GHCR package can
# land as private by default even on a public repo — if `docker pull` fails
# after this run's first publish, flip the package to public once in the
# repo's Packages settings.
#
# dist/ is built natively (this job's own runner, real amd64, no emulation)
# BEFORE the multi-platform Docker step, not inside the Dockerfile. A real
# incident on 2026-09-12 showed why: linux/arm64's `npm ci` hung under QEMU
# emulation for 6 hours until GitHub's own job-level timeout killed the run
# — a known class of issue for I/O-heavy npm installs under an emulated
# architecture. Docker's job now is purely packaging an already-built dist/,
# which is cheap even emulated; the actual heavy build work (npm ci, Python/
# Jinja2, terser) runs once, natively, matching deploy.yml's own Node/Python
# setup exactly (same pinned action SHAs — see that workflow's own comments
# for why pinned, not tags).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pdfree-selfhosted

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip3 install jinja2

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site (produces dist/)
        run: python3 scripts/build.py

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same reasoning as pdf2md-server-docker.yml's own QEMU step —
      # ubuntu-latest runners are amd64-native, QEMU is what lets Buildx
      # produce a working arm64 layer too (Apple Silicon, AWS Graviton,
      # other arm64 self-hosting boxes).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (multi-platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image (runner's own native platform)
        run: |
          docker run -d --name smoke -p 8080:8080 "${{ env.IMAGE }}:${{ github.sha }}"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health
          curl -sf http://localhost:8080/ | grep -q 'id="hero"' || (echo "homepage smoke test failed" && exit 1)
          curl -sf -o /dev/null -w '%{http_code}' http://localhost:8080/merge-pdf/ | grep -q '^200$' || (echo "tool page smoke test failed" && exit 1)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/compress/)
          [ "$code" = "301" ] || (echo "redirect smoke test failed, got $code" && exit 1)
          docker stop smoke
