name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) — scripts/build.py's _git_lastmod()
      # runs `git log -- <path>` per source file to compute each sitemap
      # <url>'s real <lastmod>. actions/checkout@v4 defaults to a shallow
      # (depth-1) clone, under which `git log` finds no history for any file
      # not touched in that single fetched commit and _git_lastmod() falls
      # back to today's date — meaning virtually every page in the sitemap
      # silently showed "last deploy date" instead of its true last-changed
      # date. Confirmed live: watermark-pdf/ and a blog post both showed
      # today's date in production despite real last commits from 2 weeks
      # earlier. Full history costs nothing meaningful here (.git is ~76MB).
      # Pinned to the exact commit SHA behind the v4 tag (v4.4.0), not the
      # tag itself — same "never a moving alias" reasoning already applied
      # to every CDN library version and the wrangler deploy step. A tag
      # can be moved by the action's maintainer (accidentally, or via a
      # compromised account); a commit SHA can't. Verified by resolving
      # `git refs/tags/v4` via the GitHub API immediately before pinning
      # (`gh api repos/actions/checkout/git/refs/tags/v4`), not copied from
      # an unverified source. Re-resolve and re-pin deliberately on a real
      # version bump, don't just edit the SHA by hand.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip3 install jinja2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Moved before "Build site": scripts/build.py now shells out to
        # terser (node_modules/.bin) to minify dist/js/*.js — it must be
        # installed before build.py runs, not after.
        run: npm ci

      - name: Install qpdf
        # tests/worker.integration.test.js (wired into `npm test` below as of
        # this commit) shells out to `qpdf --check` to validate Protect's
        # encrypted output against an independent implementation — not
        # preinstalled on ubuntu-latest. Discovered by this exact step
        # failing the first time this test file actually ran in CI (it
        # existed but was never part of the `npm test` chain before).
        #
        # The runner image's own pre-baked google-chrome apt source (used for
        # Chrome, unrelated to us — we only want qpdf from Ubuntu's repos)
        # intermittently serves a stale/mismatched Packages.gz, which fails
        # the plain `apt-get update` this step needs for ALL configured repos
        # and blocks even an unrelated `apt-get install`. Real 2-run failure
        # (2026-09-09, identical Hash Sum mismatch both times — a mirror-sync
        # lag on Google's end, not per-request flakiness a retry would fix)
        # while shipping the zh-CN locale feature. Removing that one repo
        # file before updating scopes the update to the repos we actually
        # need and stops depending on Google's mirror being in a consistent
        # state at the exact moment this step runs.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y qpdf

      - name: Validate source pages (DOM + i18n + SW)
        run: |
          python3 scripts/check_dom.py
          python3 scripts/check_i18n.py
          python3 scripts/check_sw.py

      - name: Validate js/vendor/pdf-lib.min.js matches the pinned devDependency
        # js/vendor/pdf-lib.min.js is a manually-copied file, not tracked by
        # package-lock.json — Dependabot/npm can bump node_modules/pdf-lib
        # with zero visibility into it, silently shipping browser users a
        # different pdf-lib build than what the test suite actually ran
        # against. See scripts/check_vendor_sync.py's own header for the
        # fix procedure if this ever fails.
        run: python3 scripts/check_vendor_sync.py

      - name: Build site
        run: python3 scripts/build.py

      - name: Run JS tests
        run: npm test

      - name: Test packages/pdf2md-core (standalone npm package)
        # Separate package.json/deps from the site's own — installs and
        # syncs its own src/core/ (generated from js/, gitignored — see
        # packages/pdf2md-core/scripts/copy-core.mjs) before testing.
        # Real end-to-end tests against real PDFs, not mocks — this is
        # what actually proves pdfjs-dist's Node build stays compatible
        # with js/pdf2mdCore.js as both evolve.
        run: |
          cd packages/pdf2md-core
          npm install --omit=optional
          npm run sync
          npm test

      - name: Test packages/pdf2md-server (self-hosted REST wrapper)
        # Depends on pdf2md-core via a `file:` link, installed above — real
        # HTTP round-trip tests (spawns the actual server.js, real fetch
        # requests, real PDFs), including the two real security paths
        # (body-size limit, worker_threads-enforced timeout). Catches
        # exactly the class of bug the pdf2md-core step above already has
        # once (a Node-version-specific CJS-import failure that only
        # surfaced in CI, not local dev on a newer Node) — same reason to
        # run it here too, not just trust local testing.
        run: |
          cd packages/pdf2md-server
          npm install --omit=optional
          npm test

      - name: Lint JavaScript
        run: npm run lint -- --quiet

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E — protect password survives a batch file add
        # Real-browser regression gate for the security-relevant bug fixed
        # in commit 873f63c (js/protectUI.js's initProtectOptions rebuilding
        # the panel — and silently clearing a typed password — every time a
        # 2nd file joined the batch queue). tests/protect.logic.test.js
        # already pins the fixed state machine in isolation; this drives the
        # real module through a real browser so a future refactor that
        # breaks the same property fails the build, not just gets noticed
        # after shipping. See tests/e2e/protect.e2e.mjs's header comment.
        run: |
          python3 -m http.server 8934 --directory dist &
          sleep 2
          PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:protect

      - name: E2E — mobile sticky-button/file-list overlap
        # Real-browser regression gate for the mobile bug fixed in commit
        # 0934fc9b, reported live by the user on 2 physical devices:
        # selecting a file on mobile appeared to do nothing. #mergeBtn's
        # position:sticky pins it to a fixed viewport position; on a short
        # mobile viewport the newly-added #fileList used to render into the
        # exact same on-screen band, completely covering it. Verified this
        # test genuinely catches the regression by reverting the fix locally
        # and confirming 4/6 cases fail — not just trivially passing. See
        # tests/e2e/mobile-sticky-overlap.e2e.mjs's header comment.
        run: PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:mobile-sticky-overlap

      - name: E2E — embed/SDK contract (CSP, sandbox, ready/result/error)
        # Real-browser regression gate for the embed/SDK feature
        # (embed/sdk.js, embed/compress/index.html, js/embedBridge.js). A
        # security review (commit 765a0744) found the embed page's CSP was
        # missing semicolons after script-src/connect-src — confirmed live
        # via 10 real blocked inline-style violations in headless Chromium
        # — and added a sandbox attribute the iframe never had. Writing
        # this test then found a third bug: the SDK's documented onError
        # callback could never fire because nothing in js/processor.js
        # ever dispatched the 'pdfree:error' CustomEvent embedBridge.js was
        # already listening for (fixed alongside this test). See
        # tests/e2e/embed-sdk.e2e.mjs's own header comment.
        run: PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:embed-sdk

      - name: E2E — mobile golden path (merge) against local dist/
        # Real-browser, real-mobile-viewport regression gate: add 2 files →
        # click #mergeBtn → catch the real download → verify a genuinely
        # valid, correctly-paged PDF. Added specifically to catch a "silently
        # broken, no visible error" deploy — this repo's own history has one
        # (a past deploy broke mobile merge with zero visible error, and some
        # mobile clients' stuck Service Worker + Cache Storage couldn't
        # self-heal even after the fix shipped — see memory
        # pwa_direct_version_check_2026_09 for why a stuck client can never
        # rescue itself). This same test file runs a second time later,
        # against the real Cloudflare-hosted preview URL right before traffic
        # cutover — see the "Upload Cloudflare Worker version" step below.
        # See tests/e2e/mobile-merge-golden-path.e2e.mjs's own header comment.
        run: PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:mobile-merge-golden-path

      - name: E2E — Add Form Fields (click-to-place produces a real AcroForm PDF)
        # Real-browser regression gate for the "Add Form Fields" tool
        # (js/formFieldsUI.js + js/formFieldsWorker.js): places 2 text
        # fields via real clicks on the real rendered canvas, then verifies
        # the downloaded PDF two independent ways — pdf-lib in plain Node
        # sees real PDFTextField widgets at the expected names, AND this
        # site's own real Fill tool (/fill/, separate code path) detects
        # and can type into those exact fields. See
        # tests/e2e/formFields.e2e.mjs's own header comment.
        run: PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:formfields

      - name: E2E — Fill Cyrillic value doesn't abort appearance regeneration for the whole form
        # Real-browser regression gate for a bug found while responding to a
        # code review of an unrelated tool: js/worker.js's handleFill()
        # embedded PDFLib.StandardFonts.Helvetica (WinAnsi-only) unconditionally
        # for form.updateFieldAppearances() — confirmed by direct reproduction
        # that this throws the instant ANY field holds non-WinAnsi text
        # (Cyrillic, Greek, Vietnamese beyond WinAnsi, etc.), and since that one
        # call regenerates every dirty field's appearance in a single pass, the
        # throw — caught by a blanket try/catch — silently aborted appearance
        # regeneration for the WHOLE form, not just the offending field. Same
        # bug class Watermark hit earlier (see watermarkTextWorker.js) but was
        # never ported to Fill/Flatten/Redact. Fixed by embedding LiberationSans
        # (fontkit, same vendored file formFieldsWorker.js already uses) instead
        # of Helvetica. See tests/e2e/fill.e2e.mjs's own header comment.
        run: PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:fill

      - name: E2E — Word→PDF table with merged cells doesn't crash pdfmake
        # Real-browser regression gate for a real end-user bug report
        # (error ID DOCX2PDF-8490): a DOCX table with a merged cell (Word's
        # gridSpan/vMerge, rendered by docx-preview as real HTML colspan/
        # rowspan) crashed pdfmake with "Malformed table row, a cell is
        # undefined" — js/docxToPdfCore.js's parseTable() assumed every row
        # has the same <td> count as the first row, which breaks the
        # instant any row has a merged cell. Fixed by walking the table as
        # a real grid. Verified against the actual reporting user's own
        # file (not committed — someone else's personal document) before
        # this synthetic fixture was built to reproduce the same
        # structural pattern permanently. See tests/e2e/docx2pdf.e2e.mjs's
        # own header comment.
        run: PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:docx2pdf

      - name: E2E — Quick Edit PDF round trip (PDF -> DOCX -> edit -> PDF)
        # Real-browser regression gate for the whole Quick Edit PDF feature:
        # the Atlas ERI gate correctly blocks a text-extraction-failure
        # document, and — the tool's core promise — an edit made to a real
        # rendered docx-preview span survives the full round trip, verified
        # two independent ways (raw pdf.js re-extraction, and this site's
        # own real pdf2word tool as a second oracle). See
        # tests/e2e/quickEdit.e2e.mjs's own header comment.
        run: PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:quickedit

      - name: E2E — Quick Edit PDF document-skeleton regression (nested lists, tables, header/footer, 2-col)
        # Regression gate for a real bug found via document-skeleton stress
        # testing (2026-09-24): a multi-word line inside a numbered/indented
        # list item lost all its inter-word spaces on a PDF -> pdf2word ->
        # PDF round trip. Root cause was in the shared _p2wBuildPageData()
        # (js/pdf2readCore.js), so this also guards pdf2word/pdf2excel/
        # pdf2ppt/pdf2md, not just Quick Edit. See
        # tests/e2e/quickEditSkeleton.e2e.mjs's own header comment.
        run: PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:quickedit-skeleton

      - name: Guard — no conflicting wrangler configs
        run: |
          for f in wrangler.jsonc wrangler.json; do
            test ! -f "$f" || { echo "ERROR: $f found — remove it to avoid config priority conflicts"; exit 1; }
          done

      - name: Verify all nav pages present in dist
        run: |
          for page in merge-pdf compress-pdf pagenum-pdf split-pdf jpg2pdf pdf2jpg watermark-pdf metadata-pdf extract-pdf draw-on-pdf rotate-pdf protect-pdf; do
            test -f "dist/$page/index.html" || { echo "MISSING: dist/$page/index.html"; exit 1; }
          done
          echo "All nav pages present in dist/"

      - name: Upload Cloudflare Worker version (no traffic shift yet)
        # Replaces the old single `wrangler deploy` (instant 100% cutover,
        # same as this step's own pinned-version reasoning below). Staged-
        # rollout mechanism added after a real incident: a past deploy broke
        # mobile merge with NO visible error, and some mobile clients' stuck
        # Service Worker + Cache Storage couldn't self-heal even after the
        # bug was fixed server-side (see memory pwa_direct_version_check_2026_09
        # — a device stuck on pre-fix JS can never run the code that would
        # rescue it). `versions upload` stages code+config as an immutable,
        # inert Version — confirmed for real against this exact account via a
        # throwaway spike workflow (_spike_versions_upload.yml, since
        # deleted): a clean upload, real "Worker Version ID" +
        # "Version Preview URL" lines, and the printed *.workers.dev URL
        # verified reachable (curl'd /version.json, homepage 200, a real
        # 404 for an unmatched path) — this genuinely does not move
        # production traffic. Same pinned 4.86.0, same two secrets, same
        # blast-radius posture as the step this replaces.
        #
        # 4.86.0, NOT the actual latest (4.127.1 as of this pin) — wrangler
        # raised its own minimum from Node >=20.3.0 to >=22.0.0 starting at
        # 4.87.0 (confirmed via `npm view wrangler@<version> engines.node`
        # across the range), and this workflow's own setup-node step above is
        # still on Node 20. First attempt at this pin used 4.127.1 and broke
        # the very next deploy ("Wrangler requires at least Node.js v22.0.0")
        # — did not catch it beforehand because the local sanity check
        # (`npx wrangler@4.127.1 --version`) ran on a dev machine with a
        # newer Node than CI actually uses, not the same lesson-shape as the
        # earlier CSP-severity correction this session (verify against the
        # real target environment, not a convenient stand-in). Bumping
        # setup-node to 22 instead, to ride the real latest wrangler, is a
        # reasonable follow-up but touches more of this pipeline than an
        # already-broken deploy should be fixed with under time pressure.
        id: upload_version
        run: |
          set -euo pipefail
          # --preview-alias pdfree-canary: two real runs without this (see
          # this workflow's own git history) hit real, repeated flakiness on
          # the auto-generated per-version *.workers.dev URL — a brand-new,
          # never-before-hit subdomain intermittently failed random
          # importScripts() calls (a different file each time: pdf-lib.min.js,
          # then pdfEncrypt.js, then watermarkImage.js) with a generic
          # NetworkError, even after 5 retries over ~100s. Ruled out a real
          # code bug first: an isolated repro (bare Worker + importScripts,
          # no app flow) never reproduced it, nor did 3 concurrent worker
          # creations, and the exact same failing URL passed cleanly on a
          # later manual retry. Consistent with Smart Placement (this
          # project's own [placement] mode="smart" — wrangler's own
          # upload-time warning: "your entire Worker could be moved to run
          # closer to your data source... could result in poor performance")
          # needing real traffic history to settle, which a fresh per-version
          # hash subdomain never has. A fixed --preview-alias reuses the SAME
          # hostname across every deploy instead, so it stays warm from
          # continuous real use — much closer to how production itself
          # behaves, rather than a cold subdomain hit for the first time.
          npx wrangler@4.86.0 versions upload --config wrangler.toml \
            --message "${{ github.sha }}" --preview-alias pdfree-canary \
            2>&1 | tee version_upload.log

          # Patterns grounded in the real spike run's captured output, e.g.:
          #   Worker Version ID: b718812a-4300-4d22-863e-4785650f5a7e
          #   Version Preview URL: https://b718812a-pdfree33.mahmudovbahrom555.workers.dev
          # Not guessed — if wrangler ever changes this format, fail loudly
          # below rather than silently deploying an empty/wrong version id.
          # PREVIEW_URL prefers an aliased URL (containing the fixed alias
          # name) over the per-version hash URL, since both may be printed;
          # falls back to whatever *.workers.dev URL is present either way.
          VERSION_ID=$(grep -oE 'Worker Version ID: [0-9a-f-]+' version_upload.log | awk '{print $NF}' | tail -1 || true)
          PREVIEW_URL=$(grep -oE 'https://pdfree-canary[A-Za-z0-9.-]*\.workers\.dev' version_upload.log | tail -1 || true)
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL=$(grep -oE 'Version Preview URL: https://[A-Za-z0-9.-]+' version_upload.log | awk '{print $NF}' | tail -1 || true)
          fi

          if [ -z "$VERSION_ID" ]; then
            echo "ERROR: could not parse a Worker Version ID out of wrangler's output above — refusing to proceed blind."
            exit 1
          fi
          if [ -z "$PREVIEW_URL" ]; then
            echo "ERROR: could not parse a preview URL out of wrangler's output above — refusing to proceed blind."
            exit 1
          fi

          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke-check the REAL uploaded preview version (HTTP-only)
        # Not the full real-browser golden-path test — see below for why.
        # This step confirms the ACTUAL Cloudflare Worker/Assets serving
        # layer (src/index.js routing, the [assets] binding's
        # not_found_handling/run_worker_first, real edge headers, the
        # just-built version.json) that the earlier local http.server gate
        # structurally cannot reach — via plain curl, matching
        # scripts/smoke_prod.sh's own established pattern for checking prod.
        #
        # Why not the full Playwright merge test here (tried first, see git
        # history — commits 7e516382 through a15bad59): it failed
        # repeatedly and randomly (a different vendor file's importScripts()
        # each time — pdf-lib.min.js, then pdfEncrypt.js, then
        # watermarkImage.js) on the real preview URL, even after 5 retries
        # over ~100s, even after switching to a reused --preview-alias
        # (rules out "brand-new subdomain" alone as the cause), and even
        # after removing [placement] mode="smart" (rules out Smart Placement
        # as the sole cause too). None of this reproduced in an isolated
        # repro (bare Worker + importScripts, no app flow) or under 3
        # concurrent worker creations — ruling out both a real code bug and
        # a simple concurrency race in isolation. The full real page load
        # fires ~90+ concurrent module/asset requests, ALL funneled through
        # the same Worker invocation because of run_worker_first=true —
        # consistent with hitting a real per-invocation subrequest
        # concurrency limit specifically on a still-cold preview instance,
        # not something a config flag alone fixes. The full heavy scenario
        # stays as the LOCAL pre-deploy gate above (100% reliable there,
        # proven to catch real regressions by deliberately breaking it) —
        # this lighter HTTP check still exercises the real Cloudflare-layer
        # basics without the request-volume profile that triggers the
        # instability. Revisit the full real-browser preview check only if
        # a lower-concurrency alternative is found (e.g. disabling
        # run_worker_first for static paths), not by retrying further.
        run: |
          set -euo pipefail
          PREVIEW="${{ steps.upload_version.outputs.preview_url }}"

          echo "Checking $PREVIEW/version.json matches this commit..."
          # Cache-busted (?_cb=): version.json is served with the SAME
          # aggressive `immutable, max-age=31536000` header Cloudflare's
          # Assets binding applies to every static file by default — a bare
          # request to a fixed --preview-alias hostname can return a PRIOR
          # deploy's cached response. Real bug hit on an early run of this
          # check: it reported the previous commit's version, not this run's,
          # with no error otherwise — matches exactly how js/app.js's own
          # _checkVersionMismatch() already cache-busts this same URL with
          # `?t=<cachebust>` + `cache:'no-store'` for the identical reason.
          #
          # Retries up to 6 times, 5s apart (~30s total): even WITH
          # cache-busting, a separate real run hit the identical symptom —
          # the reused --preview-alias hostname's own DNS/routing pointer
          # briefly still resolving to the PRIOR version immediately after
          # `versions upload --preview-alias` reassigns it, before that
          # reassignment has propagated to every Cloudflare edge node. A
          # cache-busting query param can't fix a control-plane propagation
          # delay — only waiting can. Once this specific check passes, the
          # alias is confirmed fully repointed, so the checks below (which
          # depend on the same alias serving fresh content) can trust it.
          EXPECTED="${GITHUB_SHA:0:8}"
          REMOTE_VERSION=""
          for attempt in 1 2 3 4 5 6; do
            REMOTE_VERSION=$(curl -sf --max-time 15 "$PREVIEW/version.json?_cb=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])" || true)
            if [ "$REMOTE_VERSION" = "$EXPECTED" ]; then
              break
            fi
            echo "Attempt $attempt: preview version.json says '$REMOTE_VERSION', expected '$EXPECTED' — waiting 5s for alias propagation."
            sleep 5
          done
          if [ "$REMOTE_VERSION" != "$EXPECTED" ]; then
            echo "ERROR: preview version.json still says '$REMOTE_VERSION' after 6 attempts, expected '$EXPECTED'"
            exit 1
          fi
          echo "OK — version.json matches ($REMOTE_VERSION)"

          echo "Checking $PREVIEW/merge-pdf/ ..."
          BODY=$(curl -sf --max-time 15 "$PREVIEW/merge-pdf/")
          for marker in 'id="mergeBtn"' 'id="fileInput"' 'SoftwareApplication' 'FAQPage' 'HowTo' 'BreadcrumbList'; do
            # <<< (here-string), not `echo "$BODY" | grep -q` — grep -q exits
            # the instant it finds a match, and under `set -o pipefail` that
            # early exit can SIGPIPE the still-writing `echo` side of a real
            # pipe on a large body, which pipefail then reports as the WHOLE
            # pipeline failing even though grep itself already matched. Real
            # bug hit on the very first run of this exact script: it reported
            # "$mergeBtn" missing (false) with a literal "Broken pipe" error
            # right above it, on a page that plainly has it. A here-string
            # has no such pipe between two processes, so grep's own exit
            # code alone decides the outcome.
            grep -qF "$marker" <<< "$BODY" || { echo "ERROR: /merge-pdf/ is missing expected marker: $marker"; exit 1; }
          done
          echo "OK — /merge-pdf/ has real content and all 4 JSON-LD schema types"

          echo "Checking a real 404 for an unmatched path..."
          CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$PREVIEW/this-path-does-not-exist-e2e-check/")
          [ "$CODE" = "404" ] || { echo "ERROR: expected 404, got $CODE"; exit 1; }
          echo "OK — unmatched path returns a real 404"

          echo "Checking js/vendor/pdf-lib.min.js is served correctly..."
          HEADERS=$(curl -sfI --max-time 15 "$PREVIEW/js/vendor/pdf-lib.min.js")
          grep -qi "^content-type: text/javascript" <<< "$HEADERS" \
            || { echo "ERROR: pdf-lib.min.js missing expected content-type"; exit 1; }
          echo "OK — vendor asset serves with the right content-type"

      - name: Cut traffic to the new version (100%)
        # Only reached if every gate above passed. Production has served the
        # LAST-GOOD version this entire time — this is the single moment
        # real users start seeing the new code. On any failure above, the
        # job already stopped: nothing was ever promoted, so there is
        # nothing to roll back, and the existing "Notify Telegram on
        # failure" step below still fires.
        run: |
          npx wrangler@4.86.0 versions deploy \
            "${{ steps.upload_version.outputs.version_id }}@100" -y \
            --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge Cloudflare CDN cache — everything
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=pdfree.io" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Cache purge:', 'OK' if d.get('success') else d)"

      - name: Smoke test — all nav pages return 200
        run: |
          sleep 15
          FAIL=0
          for path in / /merge-pdf/ /compress-pdf/ /pagenum-pdf/ /split-pdf/ /draw-on-pdf/ /rotate-pdf/ /protect-pdf/; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://pdfree.io$path")
            if [ "$CODE" = "200" ]; then
              echo "✅ $path → $CODE"
            else
              echo "❌ $path → $CODE"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Submit URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          python3 -c "
          import json, urllib.request, xml.etree.ElementTree as ET

          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('dist/sitemap.xml').getroot()
          urls = [el.text for el in root.findall('s:url/s:loc', ns)]

          payload = json.dumps({
              'host': 'pdfree.io',
              'key': '1cf67831677e5e165d22b0b4851a5e8d',
              'keyLocation': 'https://pdfree.io/1cf67831677e5e165d22b0b4851a5e8d.txt',
              'urlList': urls,
          }).encode()

          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=payload,
              headers={'Content-Type': 'application/json; charset=utf-8'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f'IndexNow: submitted {len(urls)} URLs, status {resp.status}')
          except urllib.error.HTTPError as e:
              print(f'IndexNow: HTTP {e.code} — {e.read().decode()[:200]}')
          except Exception as e:
              print(f'IndexNow: request failed — {e}')
          "

      - name: Notify Telegram on failure
        if: failure()
        # Values passed via env: and referenced as $VAR, not spliced directly
        # into the script body via ${{ }} — ${{ }} substitution happens at
        # the workflow-YAML level BEFORE the shell runs, so any value
        # containing shell metacharacters becomes literal script text at
        # that point. None of these are attacker-controllable today (push-
        # to-main only, no untrusted PR trigger puts a stranger's input in
        # github.actor/etc.), but env: avoids the whole risk class instead
        # of relying on that staying true.
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>PDFree deploy failed</b>%0A%0ACommit: <code>${COMMIT_SHA}</code>%0ABy: ${ACTOR}%0A%0A<a href='${RUN_URL}'>View run →</a>"
