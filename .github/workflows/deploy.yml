name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip3 install jinja2

      - name: Validate source pages (DOM + i18n)
        run: |
          python3 scripts/check_dom.py
          python3 scripts/check_i18n.py

      - name: Build site
        run: python3 scripts/build.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm test

      - name: Lint JavaScript
        run: npm run lint -- --quiet

      - name: Guard — no conflicting wrangler configs
        run: |
          for f in wrangler.jsonc wrangler.json; do
            test ! -f "$f" || { echo "ERROR: $f found — remove it to avoid config priority conflicts"; exit 1; }
          done

      - name: Verify all nav pages present in dist
        run: |
          for page in merge-pdf compress-pdf pagenum-pdf split-pdf jpg2pdf pdf2jpg watermark-pdf metadata-pdf extract-pdf draw-on-pdf rotate-pdf protect-pdf; do
            test -f "dist/$page/index.html" || { echo "MISSING: dist/$page/index.html"; exit 1; }
          done
          echo "All nav pages present in dist/"

      - name: Deploy to Cloudflare Workers
        run: npx wrangler@4 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge Cloudflare CDN cache — nav pages
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=pdfree.io" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://pdfree.io/merge-pdf/","https://pdfree.io/merge-pdf","https://pdfree.io/compress-pdf/","https://pdfree.io/compress-pdf","https://pdfree.io/pagenum-pdf/","https://pdfree.io/pagenum-pdf","https://pdfree.io/js/processor.js","https://pdfree.io/js/app.js","https://pdfree.io/js/worker.js","https://pdfree.io/js/pdf2wordTables.js","https://pdfree.io/js/pdf2wordBorders.js","https://pdfree.io/sw.js"]}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Cache purge:', 'OK' if d.get('success') else d)"

      - name: Smoke test — all nav pages return 200
        run: |
          sleep 15
          FAIL=0
          for path in / /merge-pdf/ /compress-pdf/ /pagenum-pdf/ /split-pdf/ /draw-on-pdf/ /rotate-pdf/ /protect-pdf/; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://pdfree.io$path")
            if [ "$CODE" = "200" ]; then
              echo "✅ $path → $CODE"
            else
              echo "❌ $path → $CODE"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Notify Telegram on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>PDFree deploy failed</b>%0A%0ACommit: <code>${{ github.sha }}</code>%0ABy: ${{ github.actor }}%0A%0A<a href='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'>View run →</a>"
