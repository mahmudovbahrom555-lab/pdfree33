name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 (full history) — scripts/build.py's _git_lastmod()
      # runs `git log -- <path>` per source file to compute each sitemap
      # <url>'s real <lastmod>. actions/checkout@v4 defaults to a shallow
      # (depth-1) clone, under which `git log` finds no history for any file
      # not touched in that single fetched commit and _git_lastmod() falls
      # back to today's date — meaning virtually every page in the sitemap
      # silently showed "last deploy date" instead of its true last-changed
      # date. Confirmed live: watermark-pdf/ and a blog post both showed
      # today's date in production despite real last commits from 2 weeks
      # earlier. Full history costs nothing meaningful here (.git is ~76MB).
      # Pinned to the exact commit SHA behind the v4 tag (v4.4.0), not the
      # tag itself — same "never a moving alias" reasoning already applied
      # to every CDN library version and the wrangler deploy step. A tag
      # can be moved by the action's maintainer (accidentally, or via a
      # compromised account); a commit SHA can't. Verified by resolving
      # `git refs/tags/v4` via the GitHub API immediately before pinning
      # (`gh api repos/actions/checkout/git/refs/tags/v4`), not copied from
      # an unverified source. Re-resolve and re-pin deliberately on a real
      # version bump, don't just edit the SHA by hand.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip3 install jinja2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        # Moved before "Build site": scripts/build.py now shells out to
        # terser (node_modules/.bin) to minify dist/js/*.js — it must be
        # installed before build.py runs, not after.
        run: npm ci

      - name: Validate source pages (DOM + i18n + SW)
        run: |
          python3 scripts/check_dom.py
          python3 scripts/check_i18n.py
          python3 scripts/check_sw.py

      - name: Build site
        run: python3 scripts/build.py

      - name: Run JS tests
        run: npm test

      - name: Test packages/pdf2md-core (standalone npm package)
        # Separate package.json/deps from the site's own — installs and
        # syncs its own src/core/ (generated from js/, gitignored — see
        # packages/pdf2md-core/scripts/copy-core.mjs) before testing.
        # Real end-to-end tests against real PDFs, not mocks — this is
        # what actually proves pdfjs-dist's Node build stays compatible
        # with js/pdf2mdCore.js as both evolve.
        run: |
          cd packages/pdf2md-core
          npm install --omit=optional
          npm run sync
          npm test

      - name: Test packages/pdf2md-server (self-hosted REST wrapper)
        # Depends on pdf2md-core via a `file:` link, installed above — real
        # HTTP round-trip tests (spawns the actual server.js, real fetch
        # requests, real PDFs), including the two real security paths
        # (body-size limit, worker_threads-enforced timeout). Catches
        # exactly the class of bug the pdf2md-core step above already has
        # once (a Node-version-specific CJS-import failure that only
        # surfaced in CI, not local dev on a newer Node) — same reason to
        # run it here too, not just trust local testing.
        run: |
          cd packages/pdf2md-server
          npm install --omit=optional
          npm test

      - name: Lint JavaScript
        run: npm run lint -- --quiet

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E — protect password survives a batch file add
        # Real-browser regression gate for the security-relevant bug fixed
        # in commit 873f63c (js/protectUI.js's initProtectOptions rebuilding
        # the panel — and silently clearing a typed password — every time a
        # 2nd file joined the batch queue). tests/protect.logic.test.js
        # already pins the fixed state machine in isolation; this drives the
        # real module through a real browser so a future refactor that
        # breaks the same property fails the build, not just gets noticed
        # after shipping. See tests/e2e/protect.e2e.mjs's header comment.
        run: |
          python3 -m http.server 8934 --directory dist &
          sleep 2
          PDFREE_BASE_URL=http://localhost:8934 npm run test:e2e:protect

      - name: Guard — no conflicting wrangler configs
        run: |
          for f in wrangler.jsonc wrangler.json; do
            test ! -f "$f" || { echo "ERROR: $f found — remove it to avoid config priority conflicts"; exit 1; }
          done

      - name: Verify all nav pages present in dist
        run: |
          for page in merge-pdf compress-pdf pagenum-pdf split-pdf jpg2pdf pdf2jpg watermark-pdf metadata-pdf extract-pdf draw-on-pdf rotate-pdf protect-pdf; do
            test -f "dist/$page/index.html" || { echo "MISSING: dist/$page/index.html"; exit 1; }
          done
          echo "All nav pages present in dist/"

      - name: Deploy to Cloudflare Workers
        # Pinned to an exact version, not the floating `@4` tag this used to be —
        # this step holds CLOUDFLARE_API_TOKEN with real production deploy rights,
        # the single highest-blast-radius credential in this whole pipeline. A
        # compromised wrangler publish under the un-pinned tag would run with
        # that token. Same "never a moving latest alias" policy this project
        # already applies to every CDN library version (js/lazyLibs.js,
        # js/pdf2jpgUI.js) — bump deliberately, not automatically.
        #
        # 4.86.0, NOT the actual latest (4.127.1 as of this pin) — wrangler
        # raised its own minimum from Node >=20.3.0 to >=22.0.0 starting at
        # 4.87.0 (confirmed via `npm view wrangler@<version> engines.node`
        # across the range), and this workflow's own setup-node step above is
        # still on Node 20. First attempt at this pin used 4.127.1 and broke
        # the very next deploy ("Wrangler requires at least Node.js v22.0.0")
        # — did not catch it beforehand because the local sanity check
        # (`npx wrangler@4.127.1 --version`) ran on a dev machine with a
        # newer Node than CI actually uses, not the same lesson-shape as the
        # earlier CSP-severity correction this session (verify against the
        # real target environment, not a convenient stand-in). Bumping
        # setup-node to 22 instead, to ride the real latest wrangler, is a
        # reasonable follow-up but touches more of this pipeline than an
        # already-broken deploy should be fixed with under time pressure.
        run: npx wrangler@4.86.0 deploy --config wrangler.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Purge Cloudflare CDN cache — everything
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=pdfree.io" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Cache purge:', 'OK' if d.get('success') else d)"

      - name: Smoke test — all nav pages return 200
        run: |
          sleep 15
          FAIL=0
          for path in / /merge-pdf/ /compress-pdf/ /pagenum-pdf/ /split-pdf/ /draw-on-pdf/ /rotate-pdf/ /protect-pdf/; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://pdfree.io$path")
            if [ "$CODE" = "200" ]; then
              echo "✅ $path → $CODE"
            else
              echo "❌ $path → $CODE"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Submit URLs to IndexNow (Bing, Yandex, Seznam, Naver)
        run: |
          python3 -c "
          import json, urllib.request, xml.etree.ElementTree as ET

          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          root = ET.parse('dist/sitemap.xml').getroot()
          urls = [el.text for el in root.findall('s:url/s:loc', ns)]

          payload = json.dumps({
              'host': 'pdfree.io',
              'key': '1cf67831677e5e165d22b0b4851a5e8d',
              'keyLocation': 'https://pdfree.io/1cf67831677e5e165d22b0b4851a5e8d.txt',
              'urlList': urls,
          }).encode()

          req = urllib.request.Request(
              'https://api.indexnow.org/indexnow',
              data=payload,
              headers={'Content-Type': 'application/json; charset=utf-8'},
              method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f'IndexNow: submitted {len(urls)} URLs, status {resp.status}')
          except urllib.error.HTTPError as e:
              print(f'IndexNow: HTTP {e.code} — {e.read().decode()[:200]}')
          except Exception as e:
              print(f'IndexNow: request failed — {e}')
          "

      - name: Notify Telegram on failure
        if: failure()
        # Values passed via env: and referenced as $VAR, not spliced directly
        # into the script body via ${{ }} — ${{ }} substitution happens at
        # the workflow-YAML level BEFORE the shell runs, so any value
        # containing shell metacharacters becomes literal script text at
        # that point. None of these are attacker-controllable today (push-
        # to-main only, no untrusted PR trigger puts a stranger's input in
        # github.actor/etc.), but env: avoids the whole risk class instead
        # of relying on that staying true.
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>PDFree deploy failed</b>%0A%0ACommit: <code>${COMMIT_SHA}</code>%0ABy: ${ACTOR}%0A%0A<a href='${RUN_URL}'>View run →</a>"
