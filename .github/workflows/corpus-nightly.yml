name: Corpus nightly — robustness and quality

# The owner's main idea (2026-10-14): a large corpus, converted, measured,
# fixed — pains first. Each night a tenth of tests/corpus/cloud/sample-v1.json
# (a stratified sample of ~8M web PDFs, CC-MAIN-2021-31-PDF-UNTRUNCATED from
# Digital Corpora: Arabic, Persian, Chinese, scans, damaged files, forms…)
# goes through every tool in a real Chromium against this build; the report
# clusters what failed, hung, crashed or came out broken. A report, not a
# gate — deploys stay gated by the small corpus in deploy.yml.
#
# Documents are fetched one by one out of the remote zips (HTTP Range,
# scripts/corpus-cloud/fetch.py) and live only on the runner: never
# committed, never uploaded as artifacts — results only.

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'run — a night of the robustness run (and the Arabic quality run); arabic — the Arabic quality run alone; sample — (re)build the sample list; sample-slides — the presentations list (PDF→PowerPoint)'
        default: run
        type: choice
        options: [run, arabic, sample, sample-slides]
      night:
        description: 'which tenth of the sample (0–9); empty = day of the year'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sample:
    if: github.event_name == 'workflow_dispatch' && startsWith(inputs.mode, 'sample')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Pick the stratified sample (Tika metadata streamed from S3)
        env:
          MODE: ${{ inputs.mode }}
        run: python3 scripts/corpus-cloud/pick_sample.py $([ "$MODE" = sample-slides ] && echo --slides) > sample-v1.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-sample
          path: sample-v1.json

  run:
    if: github.event_name == 'schedule' || inputs.mode == 'run'
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip3 install jinja2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build site
        run: python3 scripts/build.py
      - run: npx playwright install --with-deps chromium
      - name: This night's documents for this shard
        env:
          NIGHT: ${{ inputs.night }}
        run: |
          python3 - <<'EOF'
          import json, os, datetime
          sample = json.load(open('tests/corpus/cloud/sample-v1.json'))['sample']
          night = int(os.environ['NIGHT']) if os.environ.get('NIGHT') else datetime.date.today().timetuple().tm_yday % 10
          mine = [s['file'] for i, s in enumerate(sample) if i % 10 == night][${{ matrix.shard }}::5]
          open('names.txt', 'w').write('\n'.join(mine))
          print(f'night {night}, shard ${{ matrix.shard }}: {len(mine)} documents')
          EOF
      - name: Fetch them (HTTP Range out of the remote zips)
        run: python3 scripts/corpus-cloud/fetch.py corpus-cloud-docs $(cat names.txt)
      - name: Robustness run
        run: |
          python3 -m http.server 8934 --directory dist >/dev/null 2>&1 &
          sleep 2
          node scripts/corpus-cloud/robust.mjs --docs corpus-cloud-docs \
            --sample tests/corpus/cloud/sample-v1.json --out corpus-cloud-out --jobs 2 --save
      - name: Quality detectors — ours and an open engine on the same documents
        # Reference-free detectors (scripts/quality/props.py), validated by
        # hand on a blind sample before being trusted. pdf2docx is the open
        # engine to compare with; signals are pointers to check, not verdicts.
        if: always()
        run: |
          pip3 install pymupdf==1.26.5
          python3 -m venv p2d && p2d/bin/pip install -q "pymupdf<1.25" pdf2docx
          PDF2DOCX_PYTHON=p2d/bin/python python3 scripts/quality/other_engines.py corpus-cloud-docs corpus-cloud-out/files
          python3 scripts/quality/props.py --batch corpus-cloud-docs corpus-cloud-out/files corpus-cloud-out/quality-pdfree.jsonl pdf2word
          python3 scripts/quality/props.py --batch corpus-cloud-docs corpus-cloud-out/files corpus-cloud-out/quality-pdf2docx.jsonl pdf2docx
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: corpus-results-${{ matrix.shard }}
          path: |
            corpus-cloud-out/results.jsonl
            corpus-cloud-out/quality-*.jsonl

  arabic:
    # Arabic-script PDF→Word quality, every night on the SAME documents (all of
    # the sample's ar/fa/ur stratum, not a tenth), so nights compare: strict
    # per-pain metrics against the PDF's own text as MuPDF and poppler both
    # read it (scripts/quality/arabic.py), versus the frozen baseline
    # tests/corpus/cloud/arabic-baseline.jsonl. A report, not a gate. The
    # runner image is pinned: poppler comes from it, and a new poppler is a
    # new reader — never a silent baseline change.
    if: github.event_name == 'schedule' || inputs.mode == 'run' || inputs.mode == 'arabic'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # apt-get update first: the runner image's package index goes stale, and
      # installing poppler from it 404s (2026-10-23: every Arabic shard failed
      # before reading a document). Google's Chrome source is dropped first, as
      # in deploy.yml: its mirror lags and fails the whole update.
      - run: |
          pip3 install jinja2 pymupdf==1.26.5 numpy==2.2.6 fonttools==4.60.2
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Build site
        run: python3 scripts/build.py
      - run: npx playwright install --with-deps chromium
      - name: This shard's Arabic-script documents
        run: |
          python3 - <<'EOF2'
          import json
          sample = json.load(open('tests/corpus/cloud/sample-v1.json'))['sample']
          mine = [s['file'] for s in sample if s['stratum'] in ('ar', 'fa', 'ur')][${{ matrix.shard }}::6]
          open('names.txt', 'w').write('\n'.join(mine))
          print(f'shard ${{ matrix.shard }}: {len(mine)} documents')
          EOF2
      - name: Fetch them (HTTP Range out of the remote zips)
        run: python3 scripts/corpus-cloud/fetch.py arabic-docs $(cat names.txt)
      - name: PDF→Word
        run: |
          python3 -m http.server 8934 --directory dist >/dev/null 2>&1 &
          sleep 2
          # 300 s, not 180: five documents ran out of time in CI at 180 (owner,
          # 2026-10-18: a stop-gap — the report lists every timeout and the
          # runtime p50/p95/max, so slow documents stay visible)
          node scripts/corpus-cloud/robust.mjs --docs arabic-docs --tools pdf2word --out arabic-out --jobs 2 --save --timeout 300
      - name: Strict Arabic metrics
        if: always()
        run: python3 scripts/quality/arabic.py arabic-docs arabic-out/files arabic-out/arabic.jsonl --results arabic-out/results.jsonl
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: arabic-results-${{ matrix.shard }}
          path: |
            arabic-out/results.jsonl
            arabic-out/arabic.jsonl

  arabic-report:
    needs: arabic
    if: always() && needs.arabic.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write      # a red night opens (or comments on) an issue: a human is told
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: arabic-results-*
          path: results
      - name: Against the baseline
        id: compare
        run: |
          pip3 install pymupdf==1.26.5
          # one night from its shards: the corpus hash over all of them
          python3 scripts/quality/arabic.py --merge arabic-night.jsonl results/*/arabic.jsonl
          status=0
          if [ -f tests/corpus/cloud/arabic-baseline.jsonl ]; then
            # red when a document got worse or failed, or the results can't be
            # compared: a signal for a human, never a deploy gate, never a new
            # baseline
            python3 scripts/quality/arabic.py --compare tests/corpus/cloud/arabic-baseline.jsonl arabic-night.jsonl --fail-on-worse > arabic-report.md || status=1
          else
            { echo "No baseline yet. This run's arabic-night.jsonl is a candidate only: a baseline needs two CI runs that agree and the owner's approval (tests/corpus/GOLD_CHANGELOG.md). The night against itself, for its totals, runtime and timeouts:"; echo;
              python3 scripts/quality/arabic.py --compare arabic-night.jsonl arabic-night.jsonl; } > arabic-report.md
          fi
          cat arabic-report.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
      - name: A red night tells a human
        if: failure() && steps.compare.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Arabic PDF→Word nightly is red'
          { echo "$RUN"; echo; head -c 60000 arabic-report.md; } > body.md
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file body.md; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arabic-report
          path: |
            arabic-report.md
            arabic-night.jsonl

  report:
    needs: run
    if: always() && needs.run.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: corpus-results-*
          path: results
      - name: Cluster
        run: |
          python3 scripts/corpus-cloud/report.py results/*/results.jsonl > report.md
          python3 scripts/quality/compare_engines.py results/*/quality-*.jsonl >> report.md || true
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: corpus-report
          path: report.md
