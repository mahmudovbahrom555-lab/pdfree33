name: Publish pdf2md-server Docker image

# Separate from deploy.yml on purpose: that workflow ships the pdfree.io
# site on every push to main, unrelated to this package. This one only
# runs when pdf2md-server or its pdf2md-core dependency actually change
# (the server's own Dockerfile syncs core's source in at build time — see
# packages/pdf2md-server/Dockerfile's own header comment for why the
# build context is the repo root, not this directory), plus a manual
# workflow_dispatch for on-demand republishes (e.g. after only a README
# change that doesn't touch either package's real code).
#
# Publishes to GHCR (ghcr.io), not Docker Hub — uses the repo's own
# built-in GITHUB_TOKEN via docker/login-action, no separate external
# registry account/secret to create or rotate. First-ever publish to a
# new GHCR package can still land as a private package by default even on
# a public repo — if `docker pull` fails after this run's first publish,
# flip the package to public once in the repo's Packages settings
# (Package settings → Change visibility); every publish after that stays
# public automatically.
on:
  push:
    branches: [main]
    paths:
      - 'packages/pdf2md-server/**'
      - 'packages/pdf2md-core/**'
      - '.github/workflows/pdf2md-server-docker.yml'
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/pdf2md-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Read package.json version
        id: pkg
        run: echo "version=$(node -p "require('./packages/pdf2md-server/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-latest runners are amd64-native — QEMU is what lets Buildx
      # actually produce an arm64 layer here too, not just amd64. Real gap
      # found live: self-hosters on Apple Silicon / AWS Graviton / other
      # arm64 boxes got "no matching manifest for linux/arm64" on
      # `docker pull` when this was amd64-only, confirmed by pulling the
      # first published image on a real Apple Silicon Mac.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (multi-platform)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/pdf2md-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.pkg.outputs.version }}
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the published image (runner's own native platform)
        run: |
          docker run -d --name smoke -p 8080:8080 "${{ env.IMAGE }}:${{ github.sha }}"
          for i in $(seq 1 15); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health
          curl -sf --data-binary @tests/fixtures/normal-1page.pdf -H "Content-Type: application/pdf" \
            http://localhost:8080/convert | grep -q "Normal PDF" || (echo "convert smoke test failed" && exit 1)
          docker stop smoke
